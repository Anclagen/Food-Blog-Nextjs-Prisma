# Purpose canvas
# Source: /mycelium:interview brief — internal_stakeholder, not yet validated

purpose_statement: >
  Help household shoppers plan their weekly grocery list and find the cheapest
  store to buy each item, using real Norwegian supermarket price data (Kassal API),
  so they stop making fragmented price decisions across memory, offers apps, and
  in-store impulse checks.

target_audience_note: >
  Urban or suburban households with 2+ major supermarkets within
  reasonable reach (Kiwi, REMA 1000, Coop, Meny etc.). Explicitly
  out of scope for v1: rural users with single-store access, and
  shoppers who prioritise convenience or loyalty cards over price.
  These users won't benefit from comparison — the app is for people
  who have genuine choice and are motivated to use it.

jtbd:
  - user_type: "Urban household shopper (individual or couple) with multiple store options"
    functional: >
      Build a weekly shopping list and know at planning time which store (Kiwi,
      Rema 1000, Coop, etc.) offers the cheapest total basket for those exact items.
    emotional: >
      Feel in control of the grocery budget without the cognitive load of
      remembering prices, comparing booklets, or second-guessing in the aisle.
      Want substitution suggestions for commodity items but want full control
      to say "not this one" — the app should make saving easier, not override
      choices.
    social: >
      Share the mental load of grocery planning with a partner. Both people
      can see and contribute to the same list, know what the other person
      added, and mark items off in the shop so nobody doubles up or misses
      something. The "where should we shop this week?" decision becomes a
      shared, visible answer rather than whoever did the mental arithmetic
      first. Note: real-time sync (simultaneous live updates) is a v2 feature —
      v1 is a shared list that both partners can read and update, without
      requiring live push.
    validated: true
    source_class: external_human
    validation_note: >
      5 interviews (2026-05-15): wife, wife's sister + partner, 2 friends/family.
      All confirmed commodity substitutions welcome; all confirmed brand-specific
      items should not be substituted. Per-item control is the design requirement.

ux_experience_vision: >
  Sunday afternoon. You open the app and add this week's items in a couple
  of minutes — scan a few things from the fridge, search for the rest. The
  basket summary updates as you go: REMA 1000 comes out cheapest by 120kr.
  You and your wife are both on the same list; she adds two things you forgot.
  You both leave for the shop knowing exactly where you're going and roughly
  what it'll cost.
  In the store, you work through the list and check items off as they go into
  the basket. You come home having spent what you expected to spend — and
  over the month, the consistent store choices add up to 400-600kr in savings
  compared to picking stores by habit. You never once had to hold a price in
  your head.

expected_savings:
  per_shop_kr: "80-200"
  per_month_kr: "320-800"
  basket_size: "40-50 items"
  basis: >
    Comparison between Coop and REMA 1000 / Kiwi on a typical weekly shop
    without promotional offers factored in. Real savings will vary by product
    mix. Promotional pricing could increase savings further.
  note: >
    This is a meaningful outcome — 320-800kr/month is material for most
    households. The app's success metric should track whether users who
    follow the cheapest-store recommendation actually achieve savings in
    this range.

loyalty_cards:
  status: "in scope — loyalty cards do not override price comparison"
  finding: >
    Target users hold loyalty cards for Kiwi, REMA 1000, and Coop.
    Cards are not a barrier (sign-up is phone number only) and do not
    lock users to a single store. Benefits are additive perks on top of
    base pricing: bonus points on specific categories (Kiwi), some
    gated offers (REMA), and self-scan access (Coop). Coop and Kiwi
    also return cashback from accumulated points.
  v1_decision: >
    Exclude loyalty card benefits from v1 price calculations. Base price
    comparison is the primary decision driver. Loyalty perks are
    small, category-specific, and variable — factoring them in would
    add significant complexity for marginal accuracy gain at this stage.
  future_scope: >
    Points/cashback calculation is worth revisiting at v2 — "effective
    price after loyalty return" could be a meaningful differentiator.
    Track as a future opportunity in the OST.

workarounds:
  - description: >
      Mental price memory — trying to recall which store is generally cheaper
      for staple items, revised ad-hoc when a sale is spotted in-store.
    source_class: internal_stakeholder
    validated: false
  - description: >
      Separate offers-booklet app — shows weekly promotional leaflets from
      supermarkets; requires manual cross-referencing with the shopping list.
    source_class: internal_stakeholder
    validated: false

constraints:
  technical:
    - description: "Kassal API is the primary data source for Norwegian supermarket prices. EAN is the primary key."
      source_class: internal_stakeholder
    - description: >
        Kassal API free tier: 60 requests/min. A 20-item list = 20 requests.
        Caching and request batching are required before any multi-user load.
        Upgrade path exists (paid key) but adds cost.
      source_class: internal_desk
      validated: true
      evidence: "Kassal API spike (2026-05-15)"
    - description: >
        Kassal API text search has no fuzzy matching. Misspellings return no
        results. Client-side fuzzy layer (e.g. Fuse.js) or UX fallback required.
      source_class: internal_desk
      validated: true
      evidence: "Kassal API spike (2026-05-15)"
    - description: >
        Kassal API returns allergen lists per product but full catalogue
        coverage is unknown. Allergy-filtering feature must include a
        disclaimer and not be positioned as medical advice.
      source_class: internal_desk
      validated: true
      evidence: "Kassal API spike (2026-05-15)"
    - description: >
        Kassal API returns unit price history per store — enables
        'usually cheaper at X' features beyond current price comparisons.
        Worth revisiting at L2+ when north star metrics are defined.
      source_class: internal_desk
      validated: true
      evidence: "Kassal API spike (2026-05-15)"
  political: []
  regulatory: []
